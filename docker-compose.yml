services:
  db:
    image: postgres:15
    container_name: ece-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ece
      POSTGRES_PASSWORD: ecepassword
      POSTGRES_DB: ece_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: